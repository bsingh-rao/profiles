// ═══════════════════════════════════════════════════════════════

const W = 960, H = 540;
const TILE = 48;
const LEVEL_W = 1776;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const PHY = {
  gravity: 0.48,
  jumpVel: -11.5,
  runAccel: 0.8,
  runMax: 5.5,
  groundFriction: 0.82,
  airFriction: 0.95,

const GROUND_Y = 432;
const BLOCK_Y = 272;
const INFO_DURATION = 10000;

// INPUT

const keys = {};
let justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ═══════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════
const SFX = {
  ctx: null,
  muted: false,
  musicGain: null,
  musicPlaying: false,

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.4;
    this.masterGain.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.12;
    this.musicGain.connect(this.masterGain);
  },

  ensure() {
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) this.masterGain.gain.value = this.muted ? 0 : 0.4;
  },

  tone(freq, duration, type, vol, dest) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.3;
    g.gain.linearRampToValueAtTime(0, t + duration);
    o.connect(g);
    g.connect(dest || this.masterGain);
    o.start(t);
    o.stop(t + duration);
  },

  sweep(startFreq, endFreq, duration, type, vol) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.value = startFreq;
    o.frequency.linearRampToValueAtTime(endFreq, t + duration);
    g.gain.value = vol || 0.2;
    g.gain.linearRampToValueAtTime(0, t + duration);
    o.connect(g);
    g.connect(this.masterGain);
    o.start(t);
    o.stop(t + duration);
  },

  jump() {
    this.ensure();
    this.sweep(280, 580, 0.15, 'square', 0.15);
  },

  coin() {
    this.ensure();
    const t = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator();
    const o2 = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o1.type = 'square'; o1.frequency.value = 988;
    o2.type = 'square'; o2.frequency.value = 1319;
    g.gain.value = 0.18;
    g.gain.linearRampToValueAtTime(0, t + 0.3);
    o1.connect(g); o2.connect(g); g.connect(this.masterGain);
    o1.start(t); o1.stop(t + 0.08);
    o2.start(t + 0.08); o2.stop(t + 0.3);
  },

  brickBreak() {
    this.ensure();
    this.sweep(200, 60, 0.2, 'sawtooth', 0.15);
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.12, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = this.ctx.createBufferSource();
    const g = this.ctx.createGain();
    src.buffer = buf;
    g.gain.value = 0.12;
    g.gain.linearRampToValueAtTime(0, t + 0.12);
    src.connect(g); g.connect(this.masterGain);
    src.start(t);
  },

  panelOpen() {
    this.ensure();
    const t = this.ctx.currentTime;
    [523, 659, 784].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.value = 0.12;
      g.gain.linearRampToValueAtTime(0, t + 0.08 * i + 0.15);
      o.connect(g); g.connect(this.masterGain);
      o.start(t + 0.06 * i);
      o.stop(t + 0.06 * i + 0.15);
    });
  },

  panelClose() {
    this.ensure();
    this.sweep(600, 350, 0.12, 'sine', 0.1);
  },

  charSelect() {
    this.ensure();
    this.tone(440, 0.08, 'square', 0.1);
  },

  gameStart() {
    this.ensure();
    const t = this.ctx.currentTime;
    [262, 330, 392, 523].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'square';
      o.frequency.value = f;
      g.gain.value = 0.15;
      g.gain.linearRampToValueAtTime(0, t + 0.1 * i + 0.18);
      o.connect(g); g.connect(this.masterGain);
      o.start(t + 0.1 * i);
      o.stop(t + 0.1 * i + 0.18);
    });
  },

  startMusic() {
    if (this.musicPlaying || !this.ctx) return;
    this.musicPlaying = true;
    const melody = [
      262, 294, 330, 262, 0, 330, 392, 0,
      392, 440, 392, 330, 294, 262, 0, 0,
      330, 294, 262, 294, 330, 0, 262, 0,
      392, 349, 330, 294, 262, 330, 294, 0,
    ];
    const noteLen = 0.22;
    const loopMusic = () => {
      if (!this.musicPlaying) return;
      const t = this.ctx.currentTime + 0.05;
      melody.forEach((freq, i) => {
        if (freq === 0) return;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        g.gain.value = 1;
        g.gain.setValueAtTime(1, t + i * noteLen);
        g.gain.linearRampToValueAtTime(0, t + i * noteLen + noteLen * 0.85);
        o.connect(g); g.connect(this.musicGain);
        o.start(t + i * noteLen);
        o.stop(t + i * noteLen + noteLen);
      });
      this._musicTimer = setTimeout(loopMusic, melody.length * noteLen * 1000);
    };
    loopMusic();
  },

  stopMusic() {
    this.musicPlaying = false;
    if (this._musicTimer) clearTimeout(this._musicTimer);
  }
};

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// ═══════════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════════
class Particle {
  constructor(x, y, vx, vy, size, color, life) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.size = size; this.color = color;
    this.life = life; this.maxLife = life;
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.15;
  }
  update() {
    this.vy += 0.25;
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.rotV;
    this.life--;
    return this.life > 0;
  }
  draw(ctx, camX) {
    const a = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(this.x - camX, this.y);
    ctx.rotate(this.rot);
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// CLOUDS
// ═══════════════════════════════════════════════════════════════
class Cloud {
  constructor() { this.reset(true); }
  reset(init) {
    this.y = 25 + Math.random() * 100;
    this.w = 70 + Math.random() * 120;
    this.h = 22 + Math.random() * 28;
    this.speed = 0.18 + Math.random() * 0.3;
    this.alpha = 0.5 + Math.random() * 0.4;
    this.bumps = 3 + Math.floor(Math.random() * 3);
    this.seed = Math.random() * 100;
    this.x = init ? Math.random() * (LEVEL_W + W) : LEVEL_W + W + 50;
  }
  update() {
    this.x -= this.speed;
    if (this.x + this.w < -W) this.reset(false);
  }
  draw(ctx, camX) {
    const sx = this.x - camX * 0.12;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = '#FFFFFF';

    const baseY = this.y + this.h * 0.65;
    ctx.beginPath();
    ctx.ellipse(sx + this.w * 0.5, baseY, this.w * 0.48, this.h * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < this.bumps; i++) {
      const t = (i + 0.5) / this.bumps;
      const bx = sx + this.w * (0.12 + t * 0.76);
      const bh = this.h * (0.35 + 0.35 * Math.sin(t * Math.PI + this.seed));
      const bw = this.w * (0.14 + 0.08 * Math.sin(this.seed + i));
      ctx.beginPath();
      ctx.ellipse(bx, this.y + this.h * 0.55 - bh * 0.3, bw, bh, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx + this.w * 0.38, this.y + this.h * 0.22, this.w * 0.13, this.h * 0.18, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════════
class Camera {
  constructor() { this.x = 0; this.targetX = 0; }
  follow(px) {
    this.targetX = px - W * 0.35;
    this.targetX = clamp(this.targetX, 0, LEVEL_W - W);
    this.x = lerp(this.x, this.targetX, 0.09);
  }
}

// ═══════════════════════════════════════════════════════════════
// PLAYER
// ═══════════════════════════════════════════════════════════════
class Player {
  constructor(x, y, charIdx) {
    this.x = x; this.y = y;
    this.w = 30; this.h = 44;
    this.vx = 0; this.vy = 0;
    this.grounded = false;
    this.coyote = 0;
    this.jumpHeld = false;
    this.facing = 1;
    this.frame = 0;
    this.frameTimer = 0;
    this.state = 'idle';
    this.charIdx = charIdx;
  }

  update(paused) {
    if (paused) return;
    const onGround = this.grounded;
    let inputX = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) inputX = -1;
    if (keys['ArrowRight'] || keys['KeyD']) inputX = 1;
    if (inputX !== 0) this.facing = inputX;

    const accel = onGround ? PHY.runAccel : PHY.airAccel;
    const friction = onGround ? PHY.groundFriction : PHY.airFriction;
    this.vx += inputX * accel;
    this.vx *= friction;
    if (Math.abs(this.vx) > PHY.runMax) this.vx = PHY.runMax * Math.sign(this.vx);
    if (Math.abs(this.vx) < 0.12) this.vx = 0;

    const wantJump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
    if (wantJump && !this.jumpHeld && this.coyote > 0) {
      this.vy = PHY.jumpVel;
      this.grounded = false;
      this.coyote = 0;
      this.jumpHeld = true;
      SFX.jump();
    }
    if (!wantJump) this.jumpHeld = false;
    if (!wantJump && this.vy < 0) this.vy *= PHY.jumpCutMul;

    this.vy += PHY.gravity;
    if (this.vy > PHY.maxFall) this.vy = PHY.maxFall;

    this.x += this.vx;
    this.y += this.vy;
    this.x = clamp(this.x, 0, LEVEL_W - this.w);

    if (this.y + this.h >= GROUND_Y) {
      this.y = GROUND_Y - this.h;
      this.vy = 0;
      this.grounded = true;
      this.coyote = PHY.coyoteFrames;
    } else {
      if (this.grounded) this.coyote = PHY.coyoteFrames;
      this.grounded = false;
      if (this.coyote > 0) this.coyote--;
    }

    if (Math.abs(this.vx) > 0.3 && onGround) {
      this.state = 'run';
      this.frameTimer++;
      if (this.frameTimer > 5) { this.frame = (this.frame + 1) % 4; this.frameTimer = 0; }
    } else if (!this.grounded) {
      this.state = this.vy < 0 ? 'jump' : 'fall';
    } else {
      this.state = 'idle';
      this.frame = 0;
    }
  }

  draw(ctx, camX) {
    const c = CHARS[this.charIdx];
    const sx = Math.round(this.x - camX);
    const sy = Math.round(this.y);
    const s = 2.5;
    const flip = this.facing === -1;

    ctx.save();
    if (flip) {
      ctx.translate(sx + this.w, sy);
      ctx.scale(-1, 1);
    } else {
      ctx.translate(sx, sy);
    }

    ctx.fillStyle = c.hat;
    ctx.fillRect(2*s, 0, 8*s, 2*s);
    ctx.fillRect(1*s, 1.5*s, 10*s, 2*s);

    ctx.fillStyle = c.skin;
    ctx.fillRect(3*s, 3*s, 6*s, 5*s);

    ctx.fillStyle = c.eyes;
    ctx.fillRect(5*s, 4.5*s, 1.2*s, 1.5*s);
    ctx.fillRect(7.5*s, 4.5*s, 1.2*s, 1.5*s);

    ctx.fillStyle = c.body;
    ctx.fillRect(2.5*s, 8*s, 7*s, 5*s);

    ctx.fillStyle = c.skin;
    if (this.state === 'jump') {
      ctx.fillRect(0, 6*s, 2.5*s, 2*s);
      ctx.fillRect(9.5*s, 6*s, 2.5*s, 2*s);
    } else if (this.state === 'run') {
      const off = (this.frame % 2) * 1.5 * s;
      ctx.fillRect(0, 9*s - off, 2.5*s, 2*s);
      ctx.fillRect(9.5*s, 9*s + off - 1.5*s, 2.5*s, 2*s);
    } else {
      ctx.fillRect(0, 9*s, 2.5*s, 2.5*s);
      ctx.fillRect(9.5*s, 9*s, 2.5*s, 2.5*s);
    }

    ctx.fillStyle = c.pants;
    ctx.fillRect(3*s, 13*s, 6*s, 2*s);
    if (this.state === 'run') {
      const f = this.frame;
      const offL = (f === 0 || f === 2) ? 0 : 1.5 * s;
      const offR = (f === 0 || f === 2) ? 1.5 * s : 0;
      ctx.fillRect(3*s, 15*s - offL, 2.5*s, 2*s + offL);
      ctx.fillRect(6.5*s, 15*s - offR, 2.5*s, 2*s + offR);
    } else if (this.state === 'jump' || this.state === 'fall') {
      ctx.fillRect(2.5*s, 15*s, 3*s, 1.5*s);
      ctx.fillRect(6.5*s, 15*s, 3*s, 1.5*s);
    } else {
      ctx.fillRect(3*s, 15*s, 2.5*s, 2*s);
      ctx.fillRect(6.5*s, 15*s, 2.5*s, 2*s);
    }

    ctx.fillStyle = c.shoes;
    ctx.fillRect(2*s, 17*s, 3.5*s, 1.2*s);
    ctx.fillRect(6.5*s, 17*s, 3.5*s, 1.2*s);

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// BLOCK
// ═══════════════════════════════════════════════════════════════
class Block {
  constructor(x, y, type, label, content, subCount) {
    this.x = x; this.y = y;
    this.w = TILE; this.h = TILE;
    this.type = type;
    this.label = label;
    this.content = content;
    this.active = false;
    this.bounceOff = 0;
    this.bounceVel = 0;
    this.hitCount = 0;
    this.subCount = subCount || 0;
    this.currentSub = 0;
    this.revealed = [];
  }

  hit(game) {
    if (this.active) return;
    this.bounceOff = -10;
    this.bounceVel = 0;

    if (this.subCount > 0) {
      this.currentSub = this.hitCount % this.subCount;
      if (!this.revealed.includes(this.currentSub)) this.revealed.push(this.currentSub);
      this.hitCount++;
    }

    this.active = true;
    SFX.coin();
    game.showInfoPanel(this);

    for (let i = 0; i < 6; i++) {
      game.particles.push(new Particle(
        this.x + TILE / 2, this.y - 5,
        (Math.random() - 0.5) * 3, -Math.random() * 4 - 1,
        3 + Math.random() * 3, '#FFE898', 30 + Math.random() * 20
      ));
    }
  }

  update() {
    if (this.bounceOff < 0) {
      this.bounceVel += 1.2;
      this.bounceOff += this.bounceVel;
      if (this.bounceOff >= 0) { this.bounceOff = 0; this.bounceVel = 0; }
    }
  }

  draw(ctx, camX) {
    const sx = Math.round(this.x - camX);
    const sy = Math.round(this.y + this.bounceOff);
    const face = this.active ? PAL.blockActive : PAL.blockFace;

    ctx.fillStyle = PAL.blockShadow;
    ctx.fillRect(sx + 3, sy + 3, TILE, TILE);

    ctx.fillStyle = face;
    ctx.fillRect(sx, sy, TILE, TILE);

    ctx.strokeStyle = PAL.blockBorder;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);

    ctx.fillStyle = this.active ? '#FFF0C0' : PAL.blockQ;
    ctx.fillRect(sx + 6, sy + 6, TILE - 12, TILE - 12);

    ctx.fillStyle = PAL.blockBorder;
    ctx.font = 'bold 20px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', sx + TILE / 2, sy + TILE / 2 + 1);

    if (this.subCount > 0) {
      const subW = 10, gap = 6;
      const totalW = this.subCount * subW + (this.subCount - 1) * gap;
      const startX = sx + TILE / 2 - totalW / 2;
      for (let i = 0; i < this.subCount; i++) {
        const bx = startX + i * (subW + gap);
        const by = sy - 18;
        ctx.fillStyle = '#908070';
        ctx.fillRect(bx + subW / 2 - 1, by + subW, 2, 10);
        ctx.beginPath();
        ctx.arc(bx + subW / 2, by + subW / 2, subW / 2, 0, Math.PI * 2);
        ctx.fillStyle = this.revealed.includes(i) ? '#FFD040' : '#A09888';
        ctx.fill();
        ctx.strokeStyle = '#706048';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const labelW = ctx.measureText(this.label).width + 12;
    roundRect(ctx, sx + TILE / 2 - labelW / 2, sy + TILE + 4, labelW, 16, 3);
    ctx.fillStyle = PAL.labelBg;
    ctx.fill();
    ctx.fillStyle = PAL.labelText;
    ctx.fillText(this.label, sx + TILE / 2, sy + TILE + 8);
  }
}

// ═══════════════════════════════════════════════════════════════
// BRICK
// ═══════════════════════════════════════════════════════════════
class Brick {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = TILE; this.h = TILE;
    this.alive = true;
  }

  hit(game) {
    this.alive = false;
    SFX.brickBreak();
    const colors = [PAL.brickFace, PAL.brickBorder, PAL.brickMortar, '#C05838'];
    for (let i = 0; i < 12; i++) {
      game.particles.push(new Particle(
        this.x + Math.random() * TILE, this.y + Math.random() * TILE,
        (Math.random() - 0.5) * 5, -Math.random() * 7 - 2,
        4 + Math.random() * 6,
        colors[Math.floor(Math.random() * colors.length)],
        50 + Math.random() * 30
      ));
    }
  }

  draw(ctx, camX) {
    if (!this.alive) return;
    const sx = Math.round(this.x - camX);
    const sy = this.y;

    ctx.fillStyle = PAL.brickFace;
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.strokeStyle = PAL.brickBorder;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sx, sy, TILE, TILE);

    ctx.strokeStyle = PAL.brickMortar;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx, sy + TILE * 0.33); ctx.lineTo(sx + TILE, sy + TILE * 0.33);
    ctx.moveTo(sx, sy + TILE * 0.66); ctx.lineTo(sx + TILE, sy + TILE * 0.66);
    ctx.moveTo(sx + TILE * 0.5, sy); ctx.lineTo(sx + TILE * 0.5, sy + TILE * 0.33);
    ctx.moveTo(sx + TILE * 0.25, sy + TILE * 0.33); ctx.lineTo(sx + TILE * 0.25, sy + TILE * 0.66);
    ctx.moveTo(sx + TILE * 0.75, sy + TILE * 0.33); ctx.lineTo(sx + TILE * 0.75, sy + TILE * 0.66);
    ctx.moveTo(sx + TILE * 0.5, sy + TILE * 0.66); ctx.lineTo(sx + TILE * 0.5, sy + TILE);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════
// DECORATIONS
// ═══════════════════════════════════════════════════════════════
function drawBush(ctx, x, y, w, camX) {
  const sx = x - camX;
  ctx.fillStyle = '#2E9838';
  ctx.beginPath();
  ctx.ellipse(sx + w * 0.3, y, w * 0.3, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3AA844';
  ctx.beginPath();
  ctx.ellipse(sx + w * 0.55, y - 4, w * 0.32, 19, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2E9838';
  ctx.beginPath();
  ctx.ellipse(sx + w * 0.78, y, w * 0.25, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(100,220,100,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx + w * 0.45, y - 8, w * 0.15, 8, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawTree(ctx, x, camX) {
  const sx = x - camX;
  ctx.fillStyle = '#6B5030';
  ctx.fillRect(sx + 10, GROUND_Y - 60, 8, 60);
  ctx.fillStyle = '#289030';
  ctx.beginPath();
  ctx.moveTo(sx, GROUND_Y - 45);
  ctx.lineTo(sx + 14, GROUND_Y - 100);
  ctx.lineTo(sx + 28, GROUND_Y - 45);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#30A838';
  ctx.beginPath();
  ctx.moveTo(sx + 3, GROUND_Y - 65);
  ctx.lineTo(sx + 14, GROUND_Y - 110);
  ctx.lineTo(sx + 25, GROUND_Y - 65);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(80,200,80,0.3)';
  ctx.beginPath();
  ctx.moveTo(sx + 6, GROUND_Y - 80);
  ctx.lineTo(sx + 14, GROUND_Y - 115);
  ctx.lineTo(sx + 22, GROUND_Y - 80);
  ctx.closePath();
  ctx.fill();
}

function drawFlower(ctx, x, camX, color) {
  const sx = x - camX;
  ctx.fillStyle = '#30A030';
  ctx.fillRect(sx + 2, GROUND_Y - 8, 2, 8);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(sx + 3, GROUND_Y - 10, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFE060';
  ctx.beginPath();
  ctx.arc(sx + 3, GROUND_Y - 10, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════════
// BACKGROUND
// ═══════════════════════════════════════════════════════════════
function drawBackground(ctx, camX) {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, PAL.skyTop);
  grad.addColorStop(0.5, PAL.skyMid);
  grad.addColorStop(1, PAL.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, GROUND_Y);

  drawMountains(ctx, camX * 0.06, PAL.mountain1, PAL.mountain1Snow, [
    { x: 0, h: 130, w: 200 }, { x: 220, h: 170, w: 240 }, { x: 520, h: 140, w: 200 },
    { x: 780, h: 190, w: 260 }, { x: 1050, h: 150, w: 220 }, { x: 1350, h: 175, w: 240 },
    { x: 1620, h: 135, w: 200 }, { x: 1880, h: 165, w: 230 },
  ]);
  drawMountains(ctx, camX * 0.12, PAL.mountain2, PAL.mountain2Snow, [
    { x: 80, h: 105, w: 170 }, { x: 320, h: 135, w: 200 }, { x: 580, h: 115, w: 180 },
    { x: 850, h: 150, w: 210 }, { x: 1120, h: 120, w: 190 }, { x: 1400, h: 140, w: 200 },
    { x: 1680, h: 110, w: 170 },
  ]);

  drawHillLayer(ctx, camX * 0.2, PAL.hill1, [
    { x: 30, w: 220, h: 55 }, { x: 320, w: 260, h: 65 },
    { x: 680, w: 200, h: 50 }, { x: 950, w: 300, h: 70 },
    { x: 1320, w: 240, h: 58 }, { x: 1600, w: 220, h: 52 },
  ]);
  drawHillLayer(ctx, camX * 0.28, PAL.hill2, [
    { x: 140, w: 180, h: 42 }, { x: 450, w: 200, h: 48 },
    { x: 770, w: 160, h: 38 }, { x: 1050, w: 230, h: 52 },
    { x: 1400, w: 190, h: 44 }, { x: 1700, w: 170, h: 40 },
  ]);
}

function drawMountains(ctx, offX, color, snowColor, peaks) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-100, GROUND_Y);
  for (const p of peaks) {
    const sx = p.x - offX;
    ctx.lineTo(sx - p.w * 0.1, GROUND_Y);
    ctx.bezierCurveTo(
      sx + p.w * 0.1, GROUND_Y - p.h * 0.5,
      sx + p.w * 0.3, GROUND_Y - p.h * 0.95,
      sx + p.w * 0.5, GROUND_Y - p.h
    );
    ctx.bezierCurveTo(
      sx + p.w * 0.7, GROUND_Y - p.h * 0.95,
      sx + p.w * 0.9, GROUND_Y - p.h * 0.5,
      sx + p.w * 1.1, GROUND_Y
    );
  }
  ctx.lineTo(W + 200, GROUND_Y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = snowColor;
  for (const p of peaks) {
    const sx = p.x - offX;
    const peakX = sx + p.w * 0.5;
    const peakY = GROUND_Y - p.h;
    ctx.beginPath();
    ctx.moveTo(peakX, peakY);
    ctx.bezierCurveTo(
      peakX - p.w * 0.08, peakY + p.h * 0.08,
      peakX - p.w * 0.12, peakY + p.h * 0.15,
      peakX - p.w * 0.06, peakY + p.h * 0.22
    );
    ctx.lineTo(peakX + p.w * 0.06, peakY + p.h * 0.22);
    ctx.bezierCurveTo(
      peakX + p.w * 0.12, peakY + p.h * 0.15,
      peakX + p.w * 0.08, peakY + p.h * 0.08,
      peakX, peakY
    );
    ctx.closePath();
    ctx.fill();
  }
}

function drawHillLayer(ctx, offX, color, hills) {
  ctx.fillStyle = color;
  for (const h of hills) {
    const sx = h.x - offX;
    ctx.beginPath();
    ctx.ellipse(sx + h.w / 2, GROUND_Y, h.w / 2, h.h, 0, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
  }
}

function drawGround(ctx, camX) {
  ctx.fillStyle = PAL.grass;
  ctx.fillRect(0, GROUND_Y, W, 6);

  for (let gx = -((camX * 0.99) % 14); gx < W; gx += 12 + Math.sin(gx * 0.4) * 3) {
    ctx.fillStyle = PAL.grassLight;
    ctx.fillRect(gx, GROUND_Y - 2, 2, 5);
    ctx.fillRect(gx + 5, GROUND_Y - 3, 2, 6);
  }

  const earthGrad = ctx.createLinearGradient(0, GROUND_Y + 6, 0, H);
  earthGrad.addColorStop(0, PAL.earth);
  earthGrad.addColorStop(0.5, PAL.earthDark);
  earthGrad.addColorStop(1, PAL.stone);
  ctx.fillStyle = earthGrad;
  ctx.fillRect(0, GROUND_Y + 6, W, H - GROUND_Y - 6);
}

// ═══════════════════════════════════════════════════════════════
// INFO PANEL
// ═══════════════════════════════════════════════════════════════
class InfoPanel {
  constructor(block) {
    this.block = block;
    this.timer = INFO_DURATION;
    this.alpha = 0;
    this.scale = 0.3;
  }

  getContent() {
    const b = this.block;
    switch (b.type) {
      case 'present': return {
        title: 'PRESENT WORK',
        lines: [
          { label: 'Duration', value: PROFILE.presentWork.duration },
          { label: 'Title', value: PROFILE.presentWork.title },
          { label: 'Team', value: PROFILE.presentWork.team },
          { label: 'Company', value: PROFILE.presentWork.company },
        ]
      };
      case 'past': return {
        title: 'PAST WORK',
        lines: PROFILE.pastWork.map(p => [
          { label: 'Duration', value: p.duration },
          { label: 'Title', value: p.title },
          { label: 'Team', value: p.team },
          { label: 'Company', value: p.company },
        ]).flat()
      };
      case 'expertise': return {
        title: 'EXPERTISE',
        lines: [
          { label: 'Platforms', value: PROFILE.expertise.platforms.join(', ') },
          { label: 'Domains', value: PROFILE.expertise.domains.join(', ') },
        ]
      };
      case 'projects': {
        const idx = b.currentSub;
        const p = PROFILE.keyProjects[idx];
        return {
          title: `PROJECT ${idx + 1} / ${b.subCount}`,
          lines: [
            { label: 'Title', value: p.title },
            { label: '', value: p.description },
          ],
          canCycle: true
        };
      }
      case 'achievements': {
        const idx = b.currentSub;
        const a = PROFILE.achievements[idx];
        return {
          title: `ACHIEVEMENT ${idx + 1} / ${b.subCount}`,
          lines: [
            { label: 'Title', value: a.title },
            { label: '', value: a.description },
          ],
          canCycle: true
        };
      }
    }
  }

  update(dt) {
    this.alpha = Math.min(1, this.alpha + 0.07);
    this.scale = Math.min(1, this.scale + 0.09);
    this.timer -= dt;
    return this.timer > 0;
  }

  draw(ctx, camX) {
    const content = this.getContent();
    if (!content) return;

    const panelW = 340;
    let panelH = 72;
    ctx.font = '600 13px Inter, system-ui, sans-serif';
    for (const line of content.lines) {
      if (line.label) panelH += 36;
      else {
        const wrapped = wrapText(ctx, line.value, panelW - 40);
        panelH += wrapped.length * 18 + 8;
      }
    }
    if (content.canCycle) panelH += 22;
    panelH = Math.max(panelH, 100);

    const bsx = this.block.x - camX + TILE / 2;
    const panelX = clamp(bsx - panelW / 2, 10, W - panelW - 10);
    const panelY = clamp(this.block.y - panelH - 30, 8, GROUND_Y - panelH - 20);

    ctx.save();
    ctx.globalAlpha = this.alpha;

    const cx = panelX + panelW / 2;
    const cy = panelY + panelH / 2;
    ctx.translate(cx, cy);
    ctx.scale(this.scale, this.scale);
    ctx.translate(-cx, -cy);

    ctx.shadowColor = 'rgba(0,0,0,0.18)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = PAL.panelBg;
    roundRect(ctx, panelX, panelY, panelW, panelH, 10);
    ctx.fill();
    ctx.shadowColor = 'transparent';

    ctx.strokeStyle = PAL.panelBorder;
    ctx.lineWidth = 2;
    roundRect(ctx, panelX, panelY, panelW, panelH, 10);
    ctx.stroke();

    const arrowX = clamp(bsx, panelX + 20, panelX + panelW - 20);
    ctx.fillStyle = PAL.panelBg;
    ctx.beginPath();
    ctx.moveTo(arrowX - 8, panelY + panelH);
    ctx.lineTo(arrowX, panelY + panelH + 10);
    ctx.lineTo(arrowX + 8, panelY + panelH);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = PAL.panelBorder;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(arrowX - 9, panelY + panelH - 1);
    ctx.lineTo(arrowX, panelY + panelH + 11);
    ctx.lineTo(arrowX + 9, panelY + panelH - 1);
    ctx.stroke();
    ctx.fillStyle = PAL.panelBg;
    ctx.fillRect(arrowX - 7, panelY + panelH - 2, 14, 3);

    // Title
    ctx.fillStyle = PAL.panelText;
    ctx.font = '11px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(content.title, panelX + 18, panelY + 16);

    ctx.strokeStyle = PAL.panelBorder;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 18, panelY + 36);
    ctx.lineTo(panelX + panelW - 18, panelY + 36);
    ctx.stroke();

    // Content - clean readable font
    let ty = panelY + 46;
    for (const line of content.lines) {
      if (line.label) {
        ctx.fillStyle = PAL.panelSubtext;
        ctx.font = '600 11px Inter, system-ui, sans-serif';
        ctx.fillText(line.label, panelX + 18, ty);
        ty += 16;
        ctx.fillStyle = PAL.panelText;
        ctx.font = '700 14px Inter, system-ui, sans-serif';
        ctx.fillText(line.value, panelX + 18, ty);
        ty += 22;
      } else {
        ctx.fillStyle = PAL.panelText;
        ctx.font = '13px Inter, system-ui, sans-serif';
        const wrapped = wrapText(ctx, line.value, panelW - 40);
        for (const wl of wrapped) {
          ctx.fillText(wl, panelX + 18, ty);
          ty += 18;
        }
        ty += 6;
      }
    }

    // Cycle hint for projects/achievements
    if (content.canCycle) {
      ctx.fillStyle = PAL.panelSubtext;
      ctx.font = '10px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press ↓ for next', panelX + panelW / 2, ty + 2);
      ctx.textAlign = 'left';
    }

    // Timer bar
    const barY = panelY + panelH - 14;
    const barW = panelW - 36;
    roundRect(ctx, panelX + 18, barY, barW, 6, 3);
    ctx.fillStyle = PAL.timerBarBg;
    ctx.fill();

    const fillW = barW * (this.timer / INFO_DURATION);
    if (fillW > 1) {
      roundRect(ctx, panelX + 18, barY, fillW, 6, 3);
      ctx.fillStyle = PAL.timerBar;
      ctx.fill();
    }

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME
// ═══════════════════════════════════════════════════════════════
class Game {
  constructor(canvas, charIdx) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    this.camera = new Camera();
    this.player = new Player(80, GROUND_Y - 48, charIdx);
    this.blocks = [];
    this.bricks = [];
    this.particles = [];
    this.clouds = [];
    this.infoPanel = null;
    this.paused = false;
    this.decorations = [];
    this.running = true;
    this.controlsAlpha = 1;
    this.controlsTimer = 180;
    this.buildLevel();
    for (let i = 0; i < 12; i++) this.clouds.push(new Cloud());
  }

  buildLevel() {
    const by = BLOCK_Y;
    this.blocks.push(new Block(7 * TILE, by, 'present', 'PRESENT', null, 0));
    this.bricks.push(new Brick(9 * TILE, by));
    this.bricks.push(new Brick(10 * TILE, by));
    this.blocks.push(new Block(13 * TILE, by, 'past', 'PAST WORK', null, 0));
    this.bricks.push(new Brick(15 * TILE, by));
    this.bricks.push(new Brick(16 * TILE, by));
    this.blocks.push(new Block(20 * TILE, by, 'expertise', 'EXPERTISE', null, 0));
    this.bricks.push(new Brick(22 * TILE, by));
    this.bricks.push(new Brick(23 * TILE, by));
    this.blocks.push(new Block(27 * TILE, by, 'projects', 'PROJECTS', null, PROFILE.keyProjects.length));
    this.bricks.push(new Brick(29 * TILE, by));
    this.bricks.push(new Brick(30 * TILE, by));
    this.blocks.push(new Block(34 * TILE, by, 'achievements', 'AWARDS', null, PROFILE.achievements.length));

    this.decorations.push({ type: 'tree', x: 100 });
    this.decorations.push({ type: 'bush', x: 250, w: 70 });
    this.decorations.push({ type: 'bush', x: 520, w: 90 });
    this.decorations.push({ type: 'tree', x: 780 });
    this.decorations.push({ type: 'bush', x: 1050, w: 65 });
    this.decorations.push({ type: 'tree', x: 1280 });
    this.decorations.push({ type: 'bush', x: 1500, w: 80 });
    this.decorations.push({ type: 'flower', x: 180, color: '#FF6688' });
    this.decorations.push({ type: 'flower', x: 420, color: '#FFD040' });
    this.decorations.push({ type: 'flower', x: 700, color: '#7088FF' });
    this.decorations.push({ type: 'flower', x: 1150, color: '#FF6688' });
    this.decorations.push({ type: 'flower', x: 1580, color: '#FFD040' });
    this.decorations.push({ type: 'flower', x: 1700, color: '#7088FF' });
  }

  showInfoPanel(block) {
    this.infoPanel = new InfoPanel(block);
    this.paused = true;
    SFX.panelOpen();
  }

  cycleInfoPanel() {
    if (!this.infoPanel) return;
    const b = this.infoPanel.block;
    if (b.subCount <= 0) return;
    b.active = false;
    this.infoPanel = null;
    this.paused = false;
    SFX.panelClose();
    this.player.y = GROUND_Y - this.player.h;
    this.player.vy = 0;
    this.player.grounded = true;
    this.player.coyote = PHY.coyoteFrames;
    this.player.state = 'idle';
  }

  update(dt) {
    if (justPressed['KeyM']) SFX.toggleMute();

    for (const c of this.clouds) c.update();
    this.particles = this.particles.filter(p => p.update());

    if (this.controlsTimer > 0) {
      this.controlsTimer--;
      if (this.controlsTimer < 60) this.controlsAlpha = this.controlsTimer / 60;
    }

    if (this.infoPanel) {
      if (justPressed['ArrowDown'] || justPressed['KeyS']) {
        const content = this.infoPanel.getContent();
        if (content && content.canCycle) {
          this.cycleInfoPanel();
          return;
        }
      }
      if (!this.infoPanel.update(dt)) {
        this.infoPanel.block.active = false;
        this.infoPanel = null;
        this.paused = false;
        SFX.panelClose();
      }
      return;
    }

    this.player.update(this.paused);

    for (const b of this.blocks) {
      b.update();
      if (!b.active) this.resolveCollision(this.player, b, true);
    }
    for (const b of this.bricks) {
      if (b.alive) this.resolveCollision(this.player, b, b.alive);
    }

    this.camera.follow(this.player.x + this.player.w / 2);
  }

  resolveCollision(p, b, canHit) {
    const prevBottom = p.y + p.h - p.vy;
    const prevTop = p.y - p.vy;

    if (canHit && p.vy < 0 &&
        p.x + p.w > b.x && p.x < b.x + b.w &&
        p.y <= b.y + b.h && prevTop >= b.y + b.h - 2) {
      p.vy = 2;
      p.y = b.y + b.h;
      b.hit(this);
      return;
    }
    if (!(b instanceof Brick) || b.alive) {
      if (p.vy >= 0 &&
          p.x + p.w > b.x + 2 && p.x < b.x + b.w - 2 &&
          p.y + p.h >= b.y && prevBottom <= b.y + 4) {
        p.y = b.y - p.h;
        p.vy = 0;
        p.grounded = true;
        p.coyote = PHY.coyoteFrames;
        return;
      }
      if (overlap(p.x, p.y + 6, p.w, p.h - 12, b.x, b.y, b.w, b.h)) {
        if (p.x + p.w / 2 < b.x + b.w / 2) {
          p.x = b.x - p.w;
        } else {
          p.x = b.x + b.w;
        }
        p.vx = 0;
      }
    }
  }

  draw() {
    const ctx = this.ctx;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const camX = this.camera.x;

    drawBackground(ctx, camX);
    for (const c of this.clouds) c.draw(ctx, camX);

    for (const d of this.decorations) {
      if (d.type === 'bush') drawBush(ctx, d.x, GROUND_Y - 2, d.w, camX);
      if (d.type === 'tree') drawTree(ctx, d.x, camX);
      if (d.type === 'flower') drawFlower(ctx, d.x, camX, d.color);
    }

    drawGround(ctx, camX);

    for (const b of this.bricks) b.draw(ctx, camX);
    for (const b of this.blocks) b.draw(ctx, camX);

    this.player.draw(ctx, camX);

    for (const p of this.particles) p.draw(ctx, camX);

    if (this.infoPanel) this.infoPanel.draw(ctx, camX);

    if (this.controlsAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = this.controlsAlpha * 0.7;
      ctx.fillStyle = '#FFF8E8';
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('← →  Move     SPACE  Jump     M  Sound', W / 2, H - 15);
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#FFF8E8';
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText(SFX.muted ? 'MUTED' : '', W - 12, 10);
    ctx.restore();
  }

  loop(ts) {
    if (!this.running) return;
    const dt = 16.67;
    this.update(dt);
    this.draw();
    justPressed = {};
    requestAnimationFrame(t => this.loop(t));
  }
}

// ═══════════════════════════════════════════════════════════════
// START SCREEN
// ═══════════════════════════════════════════════════════════════
let gameStarted = false;
let selectedChar = 0;
let startCanvas, startCtx;
let titleBounce = 0;

function drawStartScreen() {
  const ctx = startCtx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, PAL.skyTop);
  grad.addColorStop(0.5, PAL.skyMid);
  grad.addColorStop(1, PAL.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = PAL.grass;
  ctx.fillRect(0, H - 80, W, 80);
  ctx.fillStyle = PAL.earth;
  ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = PAL.earthDark;
  ctx.fillRect(0, H - 30, W, 30);

  titleBounce += 0.03;
  const tOff = Math.sin(titleBounce) * 5;
  ctx.fillStyle = '#1A1814';
  ctx.font = '28px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PROFILE', W / 2, 100 + tOff);
  ctx.fillStyle = '#D06040';
  ctx.font = '32px "Press Start 2P", monospace';
  ctx.fillText('QUEST', W / 2, 145 + tOff);

  ctx.fillStyle = '#605848';
  ctx.font = '600 14px Inter, system-ui, sans-serif';
  ctx.fillText('An Interactive Professional Profile', W / 2, 192);

  ctx.fillStyle = '#1A1814';
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillText('Choose Your Character', W / 2, 250);

  const charSpacing = 140;
  const startX = W / 2 - charSpacing;
  for (let i = 0; i < CHARS.length; i++) {
    const cx = startX + i * charSpacing;
    const cy = 310;

    if (i === selectedChar) {
      ctx.strokeStyle = '#FFD040';
      ctx.lineWidth = 3;
      roundRect(ctx, cx - 35, cy - 40, 70, 95, 8);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,208,64,0.12)';
      roundRect(ctx, cx - 35, cy - 40, 70, 95, 8);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(cx - 15, cy - 25);
    const c = CHARS[i];
    const s = 2.5;
    ctx.fillStyle = c.hat;
    ctx.fillRect(2*s, 0, 8*s, 2*s);
    ctx.fillRect(1*s, 1.5*s, 10*s, 2*s);
    ctx.fillStyle = c.skin;
    ctx.fillRect(3*s, 3*s, 6*s, 5*s);
    ctx.fillStyle = c.eyes;
    ctx.fillRect(5*s, 4.5*s, 1.2*s, 1.5*s);
    ctx.fillRect(7.5*s, 4.5*s, 1.2*s, 1.5*s);
    ctx.fillStyle = c.body;
    ctx.fillRect(2.5*s, 8*s, 7*s, 5*s);
    ctx.fillStyle = c.skin;
    ctx.fillRect(0, 9*s, 2.5*s, 2.5*s);
    ctx.fillRect(9.5*s, 9*s, 2.5*s, 2.5*s);
    ctx.fillStyle = c.pants;
    ctx.fillRect(3*s, 13*s, 6*s, 2*s);
    ctx.fillRect(3*s, 15*s, 2.5*s, 2*s);
    ctx.fillRect(6.5*s, 15*s, 2.5*s, 2*s);
    ctx.fillStyle = c.shoes;
    ctx.fillRect(2*s, 17*s, 3.5*s, 1.2*s);
    ctx.fillRect(6.5*s, 17*s, 3.5*s, 1.2*s);
    ctx.restore();

    ctx.fillStyle = i === selectedChar ? '#FFD040' : '#605848';
    ctx.font = '600 13px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(CHARS[i].name, cx, cy + 48);
  }

  ctx.fillStyle = '#FFD040';
  ctx.font = '14px "Press Start 2P", monospace';
  ctx.fillText('◀', startX - 50, 310);
  ctx.fillText('▶', startX + charSpacing * 2 + 50, 310);

  const promptAlpha = 0.5 + 0.5 * Math.sin(titleBounce * 3);
  ctx.globalAlpha = promptAlpha;
  ctx.fillStyle = '#1A1814';
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillText('Press ENTER to Start', W / 2, 420);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#605848';
  ctx.font = '600 12px Inter, system-ui, sans-serif';
  ctx.fillText('← →  Select     ENTER  Start', W / 2, 470);
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('game');

function resizeCanvas() {
  const ratio = W / H;
  let cw = window.innerWidth;
  let ch = window.innerHeight;
  if (cw / ch > ratio) cw = ch * ratio;
  else ch = cw / ratio;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = W * DPR;
  canvas.height = H * DPR;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

startCanvas = canvas;
startCtx = canvas.getContext('2d');

canvas.addEventListener('click', () => canvas.focus());
canvas.setAttribute('tabindex', '0');

function startLoop() {
  if (gameStarted) return;
  if (justPressed['KeyM']) SFX.toggleMute();
  if (justPressed['ArrowLeft'] || justPressed['KeyA']) {
    selectedChar = (selectedChar - 1 + CHARS.length) % CHARS.length;
    SFX.ensure(); SFX.charSelect();
  }
  if (justPressed['ArrowRight'] || justPressed['KeyD']) {
    selectedChar = (selectedChar + 1) % CHARS.length;
    SFX.ensure(); SFX.charSelect();
  }
  if (justPressed['Enter'] || justPressed['Space']) {
    SFX.ensure(); SFX.gameStart();
    justPressed = {};
    startGame();
    return;
  }
  justPressed = {};
  drawStartScreen();
  requestAnimationFrame(startLoop);
}

startLoop();

function startGame() {
  gameStarted = true;
  window.game = new Game(canvas, selectedChar);
  SFX.startMusic();
  window.game.loop(0);
}
</script>
